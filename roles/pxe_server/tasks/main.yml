---
- name: Install PXE server packages (from the configured local mirror/Satellite)
  ansible.builtin.dnf:
    name:
      - dnsmasq
      - nginx
      - tftp-server
      - ipxe-bootimgs-x86
      - policycoreutils-python-utils
    state: present

- name: Copy ipxe.efi into the TFTP root
  ansible.builtin.copy:
    src: "{{ pxe_server_ipxe_efi_src }}"
    dest: "{{ pxe_server_tftp_root }}/ipxe.efi"
    remote_src: true
    mode: "0644"

- name: Template boot.ipxe
  ansible.builtin.template:
    src: boot.ipxe.j2
    dest: "{{ pxe_server_tftp_root }}/boot.ipxe"
    mode: "0644"

- name: Template /etc/dnsmasq.conf (TFTP only, no DNS, no DHCP)
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

# Older RHEL nginx.conf (RHEL 8) ships a "server { listen 80 default_server; }"
# block that would take requests away from pxe-map.conf below. Disabling just
# the listen directives (rather than deleting the whole block) resolves that
# and is safe to match idempotently - it no-ops once already commented out.
# RHEL 9's stock block (nginx 1.20) says plain `listen 80;`, so these two
# never match there - and need not: nginx.conf includes conf.d/*.conf BEFORE
# that block, which makes pxe-map.conf the default server on :80 (checked
# against the RHEL 9 nginx package).
- name: Disable the stock nginx default server block on port 80 (IPv4)
  ansible.builtin.replace:
    path: /etc/nginx/nginx.conf
    regexp: '^(\s*)listen(\s+)80 default_server;'
    replace: '\1# listen\g<2>80 default_server;  # disabled by pxe_server role, conflicts with pxe-map.conf'
  notify: Restart nginx

- name: Disable the stock nginx default server block on port 80 (IPv6)
  ansible.builtin.replace:
    path: /etc/nginx/nginx.conf
    regexp: '^(\s*)listen(\s+)\[::\]:80 default_server;'
    replace: '\1# listen\g<2>[::]:80 default_server;  # disabled by pxe_server role, conflicts with pxe-map.conf'
  notify: Restart nginx

- name: Template /etc/nginx/conf.d/pxe-map.conf
  ansible.builtin.template:
    src: nginx-pxe-map.conf.j2
    dest: /etc/nginx/conf.d/pxe-map.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Create the PXE map directory
  ansible.builtin.file:
    path: "{{ pxe_server_pxe_map_dir }}"
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"

- name: Register persistent SELinux file context for the PXE map directory (httpd_sys_content_t)
  community.general.sefcontext:
    target: "{{ pxe_server_pxe_map_dir }}(/.*)?"
    setype: httpd_sys_content_t
    state: present
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Apply the SELinux context to the PXE map directory
  ansible.builtin.command:
    cmd: restorecon -Rv {{ pxe_server_pxe_map_dir | quote }}
  register: _pxe_server_pxe_map_restorecon
  changed_when: _pxe_server_pxe_map_restorecon.stdout != ""
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Register persistent SELinux file context for the TFTP root (tftpdir_rw_t)
  community.general.sefcontext:
    target: "{{ pxe_server_tftp_root }}(/.*)?"
    setype: tftpdir_rw_t
    state: present
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Apply the SELinux context to the TFTP root
  ansible.builtin.command:
    cmd: restorecon -Rv {{ pxe_server_tftp_root | quote }}
  register: _pxe_server_tftp_restorecon
  changed_when: _pxe_server_tftp_restorecon.stdout != ""
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Gather service facts (is firewalld installed?)
  ansible.builtin.service_facts:
  when: not (pxe_server_firewalld_enabled | bool)

# Access to the VM is controlled outside it (pxe_server_firewalld_enabled:
# false), so no host firewall: left running, firewalld would block TFTP, HTTP
# and the API port, and with no rules managed here nothing would open them.
- name: Stop and disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - not (pxe_server_firewalld_enabled | bool)
    - "'firewalld.service' in ansible_facts.services"

- name: Open firewalld for TFTP and HTTP
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - tftp
    - http
  when: pxe_server_firewalld_enabled | bool

- name: Open firewalld for the dnsmasq TFTP data port range
  ansible.posix.firewalld:
    port: "{{ pxe_server_tftp_port_range_start }}-{{ pxe_server_tftp_port_range_end }}/udp"
    permanent: true
    immediate: true
    state: enabled
  when: pxe_server_firewalld_enabled | bool

- name: Enable and start dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: started

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
