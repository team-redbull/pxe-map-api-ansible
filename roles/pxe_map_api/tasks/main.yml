---
- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: System user and directories
  ansible.builtin.import_tasks: user.yml

- name: SELinux file context
  ansible.builtin.import_tasks: selinux.yml

- name: Application code and venv
  ansible.builtin.import_tasks: app.yml

- name: Config and systemd service
  ansible.builtin.import_tasks: service.yml

# Only when the VM runs firewalld (pxe_server_firewalld_enabled, the
# pxe_server role's switch - default false, firewalld stopped).
- name: Firewall for the API port
  ansible.builtin.import_tasks: firewall.yml
  when: pxe_server_firewalld_enabled | default(false) | bool
