---
pxe_map_api_user: pxe-map-api
pxe_map_api_group: "{{ pxe_map_api_user }}"

pxe_map_api_app_dir: /opt/pxe-map-api
pxe_map_api_venv_dir: "{{ pxe_map_api_app_dir }}/.venv"
pxe_map_api_config_dir: /etc/pxe-map-api

# PXE_MAP_DIR / PXE_MAP_BIND / PXE_MAP_TOKEN - see app/config.py. Bind and
# dir are given safe defaults here; token has none on purpose (see
# preflight.yml) so a site can't accidentally deploy unauthenticated.
pxe_map_api_dir: /var/www/pxe-map
pxe_map_api_bind: "0.0.0.0:8080"
pxe_map_api_token: ""
pxe_map_api_allow_no_auth: false

# The port firewalld opens - derived from the bind, so the two cannot drift.
pxe_map_api_port: "{{ pxe_map_api_bind.rsplit(':', 1) | last }}"

# Who may reach that port: the source addresses/CIDRs this site's MCE cluster
# calls the API from (its nodes' or egress IPs) - the API's only client.
# Never the provisioning network the booting hosts DHCP on. RHEL's firewalld
# blocks the port by default, so with nothing here the API is unreachable
# from the MCE and every IPMI install retries forever against it; preflight
# therefore refuses an empty list unless pxe_map_api_firewall_open_to_all is
# set explicitly (same pattern as the token). Set per site in
# inventory/host_vars/<site>/vars.yml.
pxe_map_api_allowed_sources: []
pxe_map_api_firewall_open_to_all: false

# The interpreter the venv is built with - NOT the platform python3: RHEL 9's
# is 3.9, and the app needs >= 3.10 (`X | None` annotations at import time;
# python-dotenv 1.2.2 has no 3.9 release at all). python3.12 ships in RHEL
# 9.4+ AppStream, so it comes from the same OS mirror as everything else.
# The local pip mirror must carry wheels for THIS version (cp312 - pydantic-core
# is the compiled one). Changing it rebuilds the venv on the next run.
pxe_map_api_python_version: "3.12"
pxe_map_api_python: "python{{ pxe_map_api_python_version }}"

# Air-gapped: pip installs from this local mirror only, never PyPI. Same
# requirement as the old deploy/install.sh's LOCAL_MIRROR.
pxe_map_api_local_mirror: /path/to/local/pip-mirror

# Where the playbook copies app/ and requirements.txt from: this repo
# (pxe-map-api-ansible) is separate from the app repo (pxe-map-api), so
# this has to point at a checkout of the latter. Defaults to a sibling
# directory of this repo (`../pxe-map-api`), which is where DEPLOY.md tells
# you to put it - override (in group_vars, or with -e) if you keep it
# somewhere else, e.g. a CI checkout path or a staged release tarball.
pxe_map_api_src_dir: "{{ playbook_dir }}/../pxe-map-api"
