---
# Non-secret per-site overrides for pxe-site4. See
# host_vars/pxe-site1/vars.yml for the full explanation of what can go here
# (e.g. pxe_map_api_bind).

# REQUIRED by the pxe_server role - replace with this site's real
# provisioning-facing IP and NIC before running --tags pxe_server.
pxe_server_vm_ip: "10.10.4.5"
pxe_server_interface: eth0

# Only with pxe_server_firewalld_enabled: true - the IPs/CIDRs this site's
# MCE cluster calls the API from (see host_vars/pxe-site1/vars.yml).
# pxe_map_api_allowed_sources:
#   - "10.10.4.0/26"
