---
# Non-secret per-site overrides for pxe-site1. Defaults (pxe_map_api_dir,
# pxe_map_api_local_mirror) come from group_vars/pxe_map_api_sites.yml -
# only override here if this specific site needs something different, e.g.:
#
# pxe_map_api_bind: "10.10.1.5:8080"   # this site's management-facing IP,
#                                       # instead of the 0.0.0.0:8080 default
#                                       # (see DEPLOY.md "Bind address")

# REQUIRED by the pxe_server role - no sensible shared default across sites.
# Replace both with this site's real provisioning-facing IP and NIC before
# running --tags pxe_server (see DEPLOY.md).
pxe_server_vm_ip: "10.10.1.5"
pxe_server_interface: eth0

# REQUIRED by the pxe_map_api role (preflight fails without it): the source
# IPs/CIDRs allowed through firewalld to the API port (the port of
# pxe_map_api_bind, 8080 by default) - the addresses this site's MCE cluster
# calls the API from (its nodes' or egress IPs). Not the provisioning network
# the booting hosts are on. Or set pxe_map_api_firewall_open_to_all: true to
# open the port to every source instead.
# pxe_map_api_allowed_sources:
#   - "10.10.1.0/26"
