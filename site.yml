---
- name: Provision the PXE boot-chain prerequisites and pxe-map-api on every site PXE VM
  hosts: pxe_map_api_sites
  become: true
  roles:
    # Layer 1: TFTP (dnsmasq) + nginx boot-chain prerequisites.
    # Run alone with: --tags pxe_server
    - role: pxe_server
      tags: [pxe_server]
    # Layer 2: the pxe-map-api app itself.
    # Run alone with: --tags pxe_map_api
    - role: pxe_map_api
      tags: [pxe_map_api]
